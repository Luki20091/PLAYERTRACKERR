# ===================================================================
#
#  Formatting:
#     - Use & for color codes.
#     - HEX colors (#RRGGBB) are supported.
#     - Variables: {prefix}, {target}, {tracker}, {distance}, {amount}, {item}
#
# ===================================================================


# ==============================================================
#  ► Tracking Behaviour
# ==============================================================

# Right-clicking a compass automatically tracks the NEAREST player.
track-nearest: true

# Maximum distance (in blocks) a target can be from the tracker.
tracking-distance: 1000


# ==============================================================
#  ► Compass Settings
# ==============================================================

compass:
  # If true, player must HOLD the compass.
  # If false, compass only needs to be somewhere in their inventory.
  require-compass-hand: true
  
  # Which item should be considered the "compass" for this plugin.
  # Default: an ItemsAdder custom item id. For ItemsAdder items use the
  # namespaced id (e.g. "pirate_items:piracki_kompas"). For vanilla items
  # you may also use the material name (e.g. "COMPASS").
  item: "pirate_items:piracki_kompas"

  # (Display name removed) The plugin matches the configured material only.
  
  # Cooldown after clicking a compass (in seconds).
  cooldown-seconds: 300
  
  # Sent when clicking the compass while on cooldown.
  search-cooldown: '&cMusisz poczekać &f{time}s &czanim ponownie rozpoczniesz wyszukiwanie!'
  # If true, compass target updates will be rate-limited by the cooldown below.
  # Set to true to prevent constant compass target refresh; update-cooldown-seconds
  # controls how often (in seconds) the compass target is updated.
  update-cooldown-enabled: true
  update-cooldown-seconds: 60

  # If true, using the configured compass item will consume 1 durability (if the item
  # supports `Damageable` meta). When the item reaches max damage it will be
  # removed from the player's hand.
  consume-durability: false

  # If true, each time the HUD cooldown seconds decreases (action bar refresh)
  # the item will also consume 1 durability. Disable unless you intend this behavior.
  consume-on-hud-refresh: false


# ==============================================================
#  ► Tracking Fees
# ==============================================================

tracking-fee-item:
  enabled: false
  material: DIAMOND
  amount: 1
  item-taken-message: '&cRequired tracking fee of &f{amount} {item} &ctaken'

tracking-fee-vault:
  enabled: false
  amount: 0
  withdraw-fee-message: '&cWithdraw tracking fee of &f{amount} &cfrom your account!'
tracking:
  
  # Whether the tracked player's name should be visible in the action bar tracking HUD
  show-target: false


