# ==============================================================
#  ► Tracking Behaviour
# ==============================================================

# Right-clicking a compass automatically tracks the NEAREST player.
track-nearest: true

# Maximum distance (in blocks) a target can be from the tracker.
tracking-distance: 1000


# ==============================================================
#  ► Compass Settings
# ==============================================================

compass:
  # If true, player must HOLD the compass.
  # If false, compass only needs to be somewhere in their inventory.
  require-compass-hand: true
  
  # Which item should be considered the "compass" for this plugin. must be compass - sory
  item: "COMPASS"

  # (Display name removed) The plugin matches the configured material only.
  
  # Cooldown after clicking a compass (in seconds).
  cooldown-seconds: 300
  
  # Sent when clicking the compass while on cooldown.
  search-cooldown: '&cMusisz poczekać &f{time}s &czanim ponownie rozpoczniesz wyszukiwanie!'
  # If true, compass target updates will be rate-limited by the cooldown below.
  # Set to true to prevent constant compass target refresh; update-cooldown-seconds
  # controls how often (in seconds) the compass target is updated.
  update-cooldown-enabled: true
  update-cooldown-seconds: 60

  # If true, using the configured compass item will consume 1 durability (if the item
  # supports `Damageable` meta). When the item reaches max damage it will be
  # removed from the player's hand.
  consume-durability: false

  # If true, each time the HUD cooldown seconds decreases (action bar refresh)
  # the item will also consume 1 durability. Disable unless you intend this behavior.
  consume-on-hud-refresh: false

  # Display settings for server-managed compass item
  name: "&fStary Kompas: &aPiratów"
  lore:
    - "&7Kliknij PPM, aby użyć."
  # If true, plugin will register a crafting recipe for the custom compass
  recipe-enabled: true
  # Max durability when using plugin-managed durability (0 = disabled)
  max-durability: 100
  # Optional enchantment applied to the plugin-managed compass.
  # If enabled, set the enchant name (use Bukkit enum name, e.g. "VANISHING_CURSE", "DURABILITY")
  # and the level. Invalid enchant names will be ignored.
  enchant:
    enabled: false
    type: "VANISHING_CURSE"
    level: 1
  # Recipe definition for the custom compass. Provide 3 strings for the crafting shape
  # and map characters to materials under `ingredients`.
  recipe:
    # Example shape: XEX / ECE / XEX
    shape:
      - "XEX"
      - "ECE"
      - "XEX"
    # Ingredients: map single characters used in the shape to material names
    # Example: E = EMERALD, C = COMPASS
    ingredients:
      E: EMERALD
      C: COMPASS
      X: AIR
    # Amount to produce when crafting (result amount)
    result-amount: 1

  # Whether the plugin should allow stacking the compass. NOTE: Minecraft
  # enforces stack sizes per Material; `COMPASS` is normally unstackable
  # and cannot be changed via the Bukkit API. This flag only enables
  # plugin-side behavior when using a material that supports stacking.
  stackable: false


# ==============================================================
#  ► Tracking Fees
# ==============================================================

tracking-fee-item:
  enabled: false
  material: DIAMOND
  amount: 1
  item-taken-message: '&cRequired tracking fee of &f{amount} {item} &ctaken'

tracking-fee-vault:
  enabled: false
  amount: 0
  withdraw-fee-message: '&cWithdraw tracking fee of &f{amount} &cfrom your account!'
tracking:
  
  # Whether the tracked player's name should be visible in the action bar tracking HUD
  show-target: false


